remote_theme: just-the-docs/just-the-docs@v0.10.1

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Site settings
title: "Kasper Brandenburg"
description: "Knowledge Base & Security Research"
url: "https://www.kasperbrandenburg.dk"
baseurl: ""

# Just the Docs theme settings
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation structure
nav_sort: case_insensitive

# Footer settings
footer_content: "Copyright &copy; 2025 Kasper Brandenburg. Distributed under an <a href=\"https://github.com/kasperbrandenburg/kasperbrandenburg.github.io/blob/main/LICENSE\">MIT license.</a>"

# Color scheme (light, dark, or auto)
color_scheme: auto

# Aux links for the upper right navigation
aux_links:
  "View on GitHub":
    - "https://github.com/kasperbrandenburg/kasperbrandenburg.github.io"

# Makes Aux links open in a new tab
aux_links_new_tab: true

# GitHub Pages / Jekyll settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge